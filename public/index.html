<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBC Monitoring Dashboard – Kabupaten Sragen</title>
<link rel="icon" href="logo_dinkes.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu utama">
    <div class="side-kepala">
      <a class="brand" href="#dashboard"><span class="logo logo-img"><img src="logo_dinkes.png" alt="Logo Dinas Kesehatan Kabupaten Sragen"></span><div class="lbl"><b>TBC Monitoring</b><small>Kabupaten Sragen</small></div></a>
      <button class="btn-lipat" id="lipat" type="button" aria-label="Ciutkan atau tampilkan sidebar" aria-expanded="true" title="Ciutkan / tampilkan menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    <button class="geser-menu kiri" id="geser-kiri" type="button" aria-label="Geser menu ke kiri" title="Geser menu ke kiri" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <nav id="nav" aria-label="Navigasi"></nav>
    <button class="geser-menu kanan" id="geser-kanan" type="button" aria-label="Geser menu ke kanan" title="Geser menu ke kanan" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <button class="tata" id="tata" type="button" aria-label="Pindahkan menu ke atas" title="Pindahkan menu ke atas" data-label="Menu di atas">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span class="lbl" id="tata-teks">Menu di atas</span>
    </button>
    <div class="side-foot lbl">Data kesehatan bersifat rahasia. Hanya angka agregat yang disimpan.</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="konten">
    <div class="topbar" id="topbar">
      <button class="hamb" id="menu" type="button" aria-label="Buka menu" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      </button>
      <button class="btn-kembali" id="kembali" type="button" aria-label="Kembali ke halaman sebelumnya" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Kembali</span>
      </button>
    </div>
    <main class="main">
      <header class="top" id="top">
        <div><h1 id="judul">TBC MONITORING DASHBOARD</h1><p id="subjudul">KABUPATEN SRAGEN</p></div>
        <div class="top-info" id="info-data"></div>
      </header>
      <section id="filter" class="filter" hidden></section>
      <section id="isi" class="isi"></section>
    </main>
  </div>
</div>
<div id="toast" class="toast-wrap" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="modal-box"><button class="btn ghost kecil kembali-modal" id="modal-kembali" type="button">← Kembali</button><button class="btn ghost tutup" id="modal-tutup" type="button" aria-label="Tutup">✕</button><div id="modal-isi"></div></div></div>
<script src="vendor/chart.umd.js"></script>
<script src="grafik_ppt.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
